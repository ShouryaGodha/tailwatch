# tailwatch: watch for people leaving to start companies, and for their raises and launches.
name: Founder watch
database: sqlite:///tailwatch.db
signals: founder-watch          # founding / raised / launched

models:
  default: anthropic:claude-opus-5-5

priority:
  tiers:
    - name: alumni of
      orgs: []                  # the organizations whose alumni you invest in
  aliases: {}
  trusted_feeds: []

watchlist:
  imports: [watchlist.csv]

connectors:
  github: {enabled: true}
  homepage: {enabled: true}
  bluesky: {enabled: true}
  x: {enabled: false}
  linkedin: {enabled: false, cadence_hours: 168}

feeds:
  - kind: hackernews
    name: hn-launches
    options: {query: "Launch HN OR \"out of stealth\" OR \"seed round\""}

delivery: {console: true, markdown_dir: digests}
schedule: {timezone: UTC, pass_time: "02:00", digest_time: "08:00", maintenance_time: "08:30"}
digest: {cap: 10, window_hours: 26, repost_days: 60}
switches: {verify: shadow, rank: true, engineer: false, candidates: true}
