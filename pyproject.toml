[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tailwatch"
version = "0.1.0"
description = "A plug-and-play agent harness that tracks any set of people across the web, judges what changed, verifies it and sends a daily digest."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shourya Godha" }]
keywords = ["agents", "agent-harness", "llm", "claude", "mcp", "monitoring", "people-tracking", "skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=2.12,<3",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "rich>=13,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
slack = ["slack-sdk>=3.30,<4", "aiohttp>=3.9,<4"]
postgres = ["psycopg[binary]>=3.2,<4"]
mcp = ["mcp>=1.10"]
engineer = ["claude-agent-sdk>=0.2,<0.3"]
all = ["tailwatch[slack,postgres,mcp,engineer]"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
tailwatch = "tailwatch.cli:main"

[project.urls]
Homepage = "https://github.com/ShouryaGodha/tailwatch"
Issues = "https://github.com/ShouryaGodha/tailwatch/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tailwatch"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "tailwatch/_bundled/prompts"
"skills" = "tailwatch/_bundled/skills"
"presets" = "tailwatch/_bundled/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "B008"]
